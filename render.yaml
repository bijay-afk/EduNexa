# Render blueprint — API web service for EduNexa.
#
# The database is **Supabase** (managed Postgres), NOT a Render Postgres — so
# there is no `databases:` block here. You supply DATABASE_URL (a Supabase
# connection string) as a secret env var; Render just builds + runs the Docker
# image and wires the env through.
#
# How to launch:
#  1. Create a Supabase project → copy the **Connection string** (pgBouncer /
#     transaction pooler, port 6543) → that's your DATABASE_URL secret.
#  2. Render dashboard → New → Blueprint → select this repo; it creates the
#     `api` web service below.
#  3. Add the REDIS_URL secret (Upstash Redis, free tier) — the API boots a
#     BullMQ producer and needs a reachable Redis. Add it as a secret env var.
#  4. Provide a JWT_SECRET (or let Render generate one), then Deploy.
#
# Schema setup happens via db:push (no migrations dir exists), and the seed is
# idempotent, so curr+grades/subjects/chapters/topics are published on first run.

services:
  - type: web
    name: api
    runtime: docker
    plan: free
    dockerfilePath: infrastructure/docker/Dockerfile.api-render
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
