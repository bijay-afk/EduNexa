# Railway service config for the API — run ONCE per (new) service/environment:
#   railway api -f infrastructure/docker/railway-service.graphql
#
# Replace <SERVICE_ID> with the running service's id from `railway status --json`,
# and <ENVIRONMENT_ID> with your environment id (often the default "production").
# Sets build context to the repo root, clears the start command (so the
# Dockerfile CMD `node dist/main.js` wins), enables the /api/v1/health health
# check, and publishes target port 3000. Without healthcheck + published port,
# Railway marks deploys FAILED with no logs and the domain answers 502.

mutation {
  serviceInstanceUpdate(
    serviceId: "<SERVICE_ID>"
    input: {
      rootDirectory: "."
      builder: RAILPACK
      dockerfilePath: "infrastructure/docker/Dockerfile.api-render"
      startCommand: ""
      healthcheckPath: "/api/v1/health"
      healthcheckTimeout: 300
      restartPolicyType: ON_FAILURE
      restartPolicyMaxRetries: 10
    }
  )
  serviceDomainUpdate(
    input: {
      serviceId: "<SERVICE_ID>"
      environmentId: "<ENVIRONMENT_ID>"
      serviceDomainId: "<DOMAIN_ID>"
      domain: "api-production-836b.up.railway.app"
      targetPort: 3000
    }
  )
}