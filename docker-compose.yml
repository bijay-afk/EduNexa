services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edunexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edunexa
      POSTGRES_PASSWORD: edunexa
      POSTGRES_DB: edunexa
    ports:
      - '5432:5432'
    volumes:
      - edunexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edunexa -d edunexa']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: edunexa-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - edunexa_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  edunexa_pgdata:
  edunexa_redis: