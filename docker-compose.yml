services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: class10-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: class10
      POSTGRES_PASSWORD: class10
      POSTGRES_DB: class10
    ports:
      - '5432:5432'
    volumes:
      - class10_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U class10 -d class10']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: class10-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - class10_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  class10_pgdata:
  class10_redis: